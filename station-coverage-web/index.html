<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Độ phủ trạm cứu hộ theo tỉnh — VETC" />
    <title>Độ phủ trạm cứu hộ | VETC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'vetc-green': '#00A859',
            },
          },
        },
      };
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        margin: 0;
      }
      .bg-vetc-green {
        background-color: #00a859;
      }
      .text-vetc-green {
        color: #00a859;
      }
      .border-vetc-green {
        border-color: #00a859;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #00a859;
        border-radius: 10px;
      }
      .map-trip-tooltip.leaflet-tooltip {
        background: transparent;
        border: none;
        box-shadow: none;
        padding: 0;
      }
      .map-trip-tooltip.leaflet-tooltip::before {
        display: none;
      }
      .station-name-tooltip.leaflet-tooltip {
        background: #111827;
        color: #fff;
        border: none;
        border-radius: 10px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        padding: 8px 12px;
        font-size: 13px;
        line-height: 1.35;
        white-space: normal;
        max-width: 320px;
        width: max-content;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .station-name-tooltip.leaflet-tooltip::before {
        border-top-color: #111827;
      }
      .station-heat-canvas {
        pointer-events: none;
        transform-origin: 50% 50%;
        will-change: transform;
      }
      .rsa-dashboard-map .leaflet-container {
        z-index: 0 !important;
      }
      .rsa-dashboard-map .leaflet-pane,
      .rsa-dashboard-map .leaflet-top,
      .rsa-dashboard-map .leaflet-bottom {
        z-index: 1 !important;
      }
      .rsa-dashboard-map .leaflet-tooltip-pane {
        z-index: 2 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
